site_name: LLM Wiki
site_description: AI/ML 技术研究 + 个人知识管理
site_url: https://zhangp365.github.io/wiki_llm/
site_author: zhangp365
repo_url: https://github.com/zhangp365/wiki_llm
repo_name: zhangp365/wiki_llm
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables

nav:
  - 首页: index.md
  - 概念:
    - vLLM Prefix Caching: vllm-prefix-caching.md
    - A2A 协议详解: a2a-protocol.md
    - Task 状态机: a2a-task-state-machine.md
    - A2A 安全分析: a2a-security-analysis.md
    - A2A 生态系统: a2a-ecosystem.md
    - ACP 接口总览: acp-protocol.md
    - ACP stdio 授权流程: acp-stdio-auth-flow.md
    - Hermes Agent 记忆架构: hermes-agent-memory-architecture.md
    - ChromaFs 虚拟文件系统: concepts/chromafs-virtual-filesystem.md
    - Building effective agents: concepts/anthropic-building-effective-agents.md
    - Claude Agent SDK: concepts/anthropic-building-agents-agent-sdk.md
    - Advanced Tool Use: concepts/anthropic-advanced-tool-use.md
    - Writing Tools for Agents: concepts/anthropic-writing-tools-for-agents.md
    - Think Tool: concepts/anthropic-think-tool.md
    - Agent Skills: concepts/anthropic-agent-skills.md
    - Context Engineering: concepts/anthropic-context-engineering.md
    - Contextual Retrieval: concepts/anthropic-contextual-retrieval.md
    - Harnesses for Long-running Agents: concepts/anthropic-harnesses-long-running-agents.md
    - Multi-Agent Research System: concepts/anthropic-multi-agent-research-system.md
    - Code Execution with MCP: concepts/anthropic-code-execution-mcp.md
    - Demystifying Agent Evals: concepts/anthropic-demystifying-evals.md
    - Claude Code Sandboxing: concepts/anthropic-claude-code-sandboxing.md
    - Agentic Coding Best Practices: concepts/anthropic-agentic-coding-best-practices.md
    - Postmortem Three Issues: concepts/anthropic-postmortem-three-issues.md
    - Containing Claude Across Products: concepts/anthropic-containing-claude.md
    - Scaling Managed Agents: concepts/anthropic-scaling-managed-agents.md
    - Harness Design for Long-running Apps: concepts/anthropic-harness-design-long-running-apps.md
    - April 23 Postmortem: concepts/anthropic-april-23-postmortem.md
    - Claude Code Auto Mode: concepts/anthropic-claude-code-auto-mode.md
    - The Era of Experience（体验时代）: concepts/era-of-experience.md
    - 蒙特卡洛树搜索 (MCTS): concepts/monte-carlo-tree-search.md
    - MCTS vs Alpha-Beta 搜索对比: concepts/mcts-vs-alpha-beta.md
  - 对比:
    - Agent 提示词缓存设计: prompt-cache-design-for-agents.md
    - Hermes vs Aider 缓存对比: comparisons/hermes-vs-aider-prompt-caching.md
    - A2A vs MCP: a2a-vs-mcp.md
  - Wiki 规范: SCHEMA.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhangp365
