     1|site_name: LLM Wiki
     2|site_description: AI/ML 技术研究 + 个人知识管理
     3|site_url: https://zhangp365.github.io/wiki_llm/
     4|site_author: zhangp365
     5|repo_url: https://github.com/zhangp365/wiki_llm
     6|repo_name: zhangp365/wiki_llm
     7|edit_uri: edit/main/docs/
     8|
     9|theme:
    10|  name: material
    11|  language: zh
    12|  palette:
    13|    - scheme: default
    14|      primary: indigo
    15|      accent: indigo
    16|      toggle:
    17|        icon: material/brightness-7
    18|        name: 切换到暗色模式
    19|    - scheme: slate
    20|      primary: indigo
    21|      accent: indigo
    22|      toggle:
    23|        icon: material/brightness-4
    24|        name: 切换到亮色模式
    25|  features:
    26|    - navigation.indexes
    27|    - navigation.sections
    28|    - navigation.top
    29|    - navigation.tracking
    30|    - navigation.path
    31|    - search.suggest
    32|    - search.highlight
    33|    - search.share
    34|    - toc.follow
    35|    - content.code.copy
    36|  icon:
    37|    repo: fontawesome/brands/github
    38|
    39|plugins:
    40|  - search:
    41|      lang:
    42|        - zh
    43|        - en
    44|
    45|markdown_extensions:
    46|  - toc:
    47|      permalink: true
    48|  - admonition
    49|  - pymdownx.details
    50|  - pymdownx.superfences
    51|  - pymdownx.tabbed:
    52|      alternate_style: true
    53|  - pymdownx.emoji:
    54|      emoji_index: !!python/name:material.extensions.emoji.twemoji
    55|      emoji_generator: !!python/name:material.extensions.emoji.to_svg
    56|  - pymdownx.tasklist:
    57|      custom_checkbox: true
    58|  - attr_list
    59|  - md_in_html
    60|  - tables
    61|
