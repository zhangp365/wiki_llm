site_name: LLM Wiki
site_description: AI/ML 技术研究 + 个人知识管理
site_url: https://zhangp365.github.io/wiki_llm/
site_author: zhangp365
repo_url: https://github.com/zhangp365/wiki_llm
repo_name: zhangp365/wiki_llm
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  custom_dir: docs/overrides

plugins:
  - roamlinks
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables

nav:
  - 首页: index.md
  - 概念:
    - vLLM Prefix Caching: concepts/vllm-prefix-caching.md
    - A2A 协议详解: concepts/a2a-protocol.md
    - Task 状态机: concepts/a2a-task-state-machine.md
    - A2A 安全分析: concepts/a2a-security-analysis.md
    - A2A 生态系统: concepts/a2a-ecosystem.md
    - ACP 接口总览: concepts/acp-protocol.md
    - ACP stdio 授权流程: concepts/acp-stdio-auth-flow.md
    - Hermes Agent 记忆架构: concepts/hermes-agent-memory-architecture.md
    - ChromaFs 虚拟文件系统: concepts/chromafs-virtual-filesystem.md
    - 构建高效 Agent: concepts/anthropic-building-effective-agents.md
    - Claude Agent SDK: concepts/anthropic-building-agents-agent-sdk.md
    - 高级工具使用: concepts/anthropic-advanced-tool-use.md
    - 为 Agent 编写工具: concepts/anthropic-writing-tools-for-agents.md
    - Think 工具: concepts/anthropic-think-tool.md
    - Agent Skills: concepts/anthropic-agent-skills.md
    - 上下文工程: concepts/anthropic-context-engineering.md
    - 上下文检索: concepts/anthropic-contextual-retrieval.md
    - 长运行 Agent Harness: concepts/anthropic-harnesses-long-running-agents.md
    - 多 Agent 研究系统: concepts/anthropic-multi-agent-research-system.md
    - MCP 代码执行: concepts/anthropic-code-execution-mcp.md
    - Agent 评估方法论: concepts/anthropic-demystifying-evals.md
    - Claude Code 沙箱化: concepts/anthropic-claude-code-sandboxing.md
    - Agentic Coding 最佳实践: concepts/anthropic-agentic-coding-best-practices.md
    - 三起生产事故复盘: concepts/anthropic-postmortem-three-issues.md
    - 跨产品约束 Claude: concepts/anthropic-containing-claude.md
    - 扩展托管 Agent: concepts/anthropic-scaling-managed-agents.md
    - Harness 设计: concepts/anthropic-harness-design-long-running-apps.md
    - Claude Code 质量报告: concepts/anthropic-april-23-postmortem.md
    - Claude Code 自动模式: concepts/anthropic-claude-code-auto-mode.md
    - The Era of Experience: concepts/era-of-experience.md
    - 蒙特卡洛树搜索 (MCTS): concepts/monte-carlo-tree-search.md
    - MCTS vs Alpha-Beta: concepts/mcts-vs-alpha-beta.md
  - 对比:
    - Agent 提示词缓存设计: comparisons/prompt-cache-design-for-agents.md
    - Hermes vs Aider 缓存对比: comparisons/hermes-vs-aider-prompt-caching.md
    - A2A vs MCP: comparisons/a2a-vs-mcp.md
  - Wiki 规范: SCHEMA.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhangp365
