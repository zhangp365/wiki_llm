name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Sync wiki content to docs/
        run: |
          mkdir -p docs/concepts docs/comparisons docs/queries docs/entities docs/notes
          cp concepts/*.md docs/concepts/ 2>/dev/null || true
          cp comparisons/*.md docs/comparisons/ 2>/dev/null || true
          cp queries/*.md docs/queries/ 2>/dev/null || true
          cp entities/*.md docs/entities/ 2>/dev/null || true
          cp notes/*.md docs/notes/ 2>/dev/null || true
          cp SCHEMA.md docs/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
